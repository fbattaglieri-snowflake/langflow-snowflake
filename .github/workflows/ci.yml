name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts proxy tests
      - run: python -m pytest -q
      - name: Scan full history for secrets (including root commit)
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: docker/langflow/Dockerfile
          - name: proxy
            dockerfile: proxy/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        env:
          FILE: ${{ matrix.dockerfile }}
          IMAGE: langflow-kit-${{ matrix.name }}:test
        run: docker build --platform linux/amd64 -f "$FILE" -t "$IMAGE" .
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Generate complete SBOM
        env:
          IMAGE: langflow-kit-${{ matrix.name }}:test
        run: trivy image --format cyclonedx --output sbom.json "$IMAGE"
      - name: Offline login and persistence smoke
        if: matrix.name == 'app'
        run: python3 scripts/smoke_image.py --image langflow-kit-app:test
      - name: Scan complete image (including unfixed findings)
        env:
          IMAGE: langflow-kit-${{ matrix.name }}:test
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom-${{ matrix.name }}
          path: sbom.json
          retention-days: 7