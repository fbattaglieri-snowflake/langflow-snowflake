name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts proxy tests
      - run: python -m pytest -q
      - name: Scan full history for secrets (including root commit)
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            dockerfile: docker/langflow/Dockerfile
          - name: proxy
            dockerfile: proxy/Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build
        env:
          FILE: ${{ matrix.dockerfile }}
          IMAGE: langflow-kit-${{ matrix.name }}:test
        run: docker build --platform linux/amd64 -f "$FILE" -t "$IMAGE" .
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - name: Generate complete SBOM
        env:
          IMAGE: langflow-kit-${{ matrix.name }}:test
        run: trivy image --format cyclonedx --output sbom.json "$IMAGE"
      - name: Offline login and persistence smoke
        if: matrix.name == 'app'
        run: python3 scripts/smoke_image.py --image langflow-kit-app:test
      - name: Scan complete image (including unfixed findings)
        env:
          IMAGE: langflow-kit-${{ matrix.name }}:test
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sbom-${{ matrix.name }}
          path: sbom.json
          retention-days: 7