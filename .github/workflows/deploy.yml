name: Deploy to Snowflake
on:
  workflow_dispatch:
    inputs:
      allow_create:
        type: boolean
        default: false
        description: Permit first creation of absent services
permissions:
  contents: read
  id-token: write
concurrency:
  group: langflow-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_CONFIG_JSON: ${{ vars.DEPLOY_CONFIG_JSON }}
      MODEL_CATALOG_JSON: ${{ vars.MODEL_CATALOG_JSON }}
      IMAGE_TAG: ${{ github.sha }}
      ALLOW_CREATE: ${{ inputs.allow_create }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: ruff check scripts proxy tests && python -m pytest -q
      - name: Materialize non-secret reviewed configuration
        run: python scripts/ci_config.py
      - uses: snowflakedb/snowflake-actions@1160898243c351349621a6c2bac2e455ab1077b2 # v3
        with:
          use-oidc: true
          cli-version: '3.16'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
      - run: snow connection test -x && snow spcs image-registry login -x
      - name: Build, scan and publish reviewed images
        run: python scripts/build_images.py --config build/config.json --publish
      - name: Non-destructive deployment
        run: |
          args=()
          if [ "$ALLOW_CREATE" = true ]; then args+=(--allow-create); fi
          python scripts/deploy.py deploy --config build/config.json \
            --catalog build/models.json --apply "${args[@]}"